[supervisord]
nodaemon=true

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0770
chown=root:root

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface


[program:postgres]
command=docker-entrypoint.sh postgres
autostart=false
autorestart=false


[program:freqtrade_dry]
command=/home/runner/data_dry/ft_client/test_client/supervisor.sh
environment=RUN_MODE="dry",FREQAI_MODEL="FREQAIMODEL_DRY",DATA_DIR="/home/runner/data_dry",CONFIG_FILE="/home/runner/data_dry/config.json",EXCHANGE_CONFIG="/home/runner/data_dry/config_examples/config_exchange.example.json"
autostart=false
autorestart=true


[program:freqtrade_live]
command=/home/runner/data_live/ft_client/test_client/supervisor.sh
environment=RUN_MODE="live",FREQAI_MODEL="FREQAIMODEL_LIVE",DATA_DIR="/home/runner/data_live",CONFIG_FILE="/home/runner/data_live/config.json",EXCHANGE_CONFIG="/home/runner/data_live/config_examples/config_exchange.example.json"
autostart=false
autorestart=true


[program:freqtrade_monitor]
command=/freqtrade.sh
autostart=false
autorestart=true
