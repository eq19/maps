[supervisord]
nodaemon=true

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:freqtrade]
command=freqtrade trade
autostart=false
autorestart=false

[program:postgres]
command=docker-entrypoint.sh postgres
autostart=true
autorestart=true

[program:freqtrade_start]
command=/start_freqtrade.sh
autostart=true
autorestart=true
