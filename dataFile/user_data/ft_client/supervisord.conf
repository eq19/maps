[supervisord]
nodaemon=true

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0770
chown=root:root

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[program:postgres]
command=docker-entrypoint.sh postgres
autostart=true
autorestart=true

[program:freqtrade]
command=freqtrade trade
autostart=false
autorestart=true
stderr_logfile=/var/log/freqtrade.error.log
stdout_logfile=/var/log/freqtrade.out.log
stderr_logfile_maxbytes=50MB
stdout_logfile_maxbytes=50MB
stderr_logfile_backups=10
stdout_logfile_backups=10

[program:monitor_freqtrade]
command=/freqtrade.sh
autostart=false
autorestart=true
stderr_logfile=/var/log/monitor_freqtrade.err.log
stdout_logfile=/var/log/monitor_freqtrade.out.log
