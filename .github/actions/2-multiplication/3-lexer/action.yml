name: 'Docker Deploy Action'

description: >
  🪂  A Github Action to deploy pages conveniently

branding:
  icon: 'command'
  color: 'green'

inputs:
  id:
    description: The deploy id
    required: false
  hub_username:
    description: Username for Docker Hub
    default: ${{ github.actor }}       
    required: true
  hub_password:
    description: Docker Hub authentication token
    required: true
  hub_token:
    description: Docker Hub authentication token
    required: true
  action_path:
    description: Path to the dockerfile from which to build the image
    required: true
  credentials:
    description: 'The gcloud credentials'
    required: true
  image_name:
    description: Tag to use for the new image
    default: ${{ github.action_repository }}
    required: true
  dockerfile_path:
    description: Path to the dockerfile from which to build the image
    required: true
  initiate_pauli_sum:
    description: Build args
    required: false
    default: ""
  docker_hub_repo_short_description:
    description: Short description text for the docker hub repo
    required: true
  docker_hub_repo_readme_file_path:
    description: |
      Path of the md file which will be used as the docker hub repo readme
    required: true
  cache_src:
    description: Path for the docker cache source
    required: false
    default: /tmp/.buildx-cache
  cache_dest:
    description: Path for the docker cache destination
    required: false
    default: /tmp/.buildx-cache-new
  provider:
    description: 'The deploy provider'
    required: true
  config:
    description: The config of secrets variables
    required: true
  owner:
    description: 'The deploy owner'
    required: false
  token:
    description: 'The deploy token'
    required: false
  repository:
    description: 'The deploy repository'
    default: ${{ github.repository }}
    required: false

outputs:
  describe:
    description: Collect describe outputs
    value: ${{ steps.describe.outputs.ip }}
  compute:
    description: Collect compute outputs
    value: ${{ steps.describe.outputs.function }}

runs:
  using: composite
  steps:
    #Fill in metadata with ${{ steps.artifact.outputs.orgs_json }}
    - name: Run identity
      shell: bash
      env:
        BASE: "https://github.com/eq19/eq19.github.io.wiki.git"
        WIKI: "https://github.com/${{ env.TARGET_REPOSITORY }}.wiki.git"      
      run: |
        # Bring GitHub Env Variables in to the config file on another container usong docker from the attached deeplearning image
        export PATH=/Users/runner/work/_actions/eq19/eq19/v2/.github/entrypoint:$PATH && bash gist.sh ${BASE} $(pwd)
        if [[ "${WIKI}" != "${BASE}" ]]; then
          find . -type d -name "$(yq '.span' _config.yml)" -prune -exec sh -c 'gist.sh ${WIKI} "$1"' sh {} \;
        fi
        echo -e "\n$hr\nWORKSPACE\n$hr" && ls -alR .

    - name: ⏪ Rewind all jobs on failure
      shell: bash
      run: |
        if [[ '${{ inputs.failure_status }}' == 'true' ]]; then
      
          git config --global user.name "$GITHUB_ACTOR"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.email "$GITHUB_ACTOR@users.noreply.github.com"

          REMOTE_REPO="https://$GITHUB_ACTOR:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git clone --single-branch --branch gh-pages $REMOTE_REPO gh-pages && cd gh-pages
          git add . && git commit --allow-empty -m "rerun due to job failure" && git push
  
        else      
          
        # Assign the environment variable correctly
          #COMMIT="${{ env.LATEST_COMMIT }}"

          # Remove double quotes
          MESSAGE=$(echo "$LATEST_COMMIT" | tr -d '"')

          # Debug output to verify
          echo "Original: $LATEST_COMMIT"
          echo "Processed: $MESSAGE"

          # Commit and push changes
          git add . 
          git commit --allow-empty -m "$MESSAGE" 
          git push
 
        fi

    - name: ⚧️ Rerun workflow if failed
      if: ${{ failure() }}
      shell: bash
      run: |
        [[ "$GITHUB_JOB" == "lexering" ]] && gh workflow run "main.yml" --repo "$REPO_NAME" \
          --raw-field "RUN_MODE=$RUN_MODE" --raw-field "REMOVE_RUNNER=$REMOVE_RUNNER" \
          --raw-field "REDUCE_EPOCH=$REDUCE_EPOCH" --raw-field "BYPASS_LEXERING=$BYPASS_LEXERING"
